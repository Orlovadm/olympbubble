<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#060708" />
    <title>Take a breather</title>
    <style>
:root {
  color-scheme: dark;
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #060708;
  color: #f7f8f8;
  -webkit-tap-highlight-color: transparent;
}

* { box-sizing: border-box; }

html, body { min-height: 100%; }
html, body { overflow-x: hidden; }

body {
  margin: 0;
  background:
    radial-gradient(circle at 50% 31%, rgba(105, 255, 237, .055), transparent 34%),
    #060708;
  overscroll-behavior: none;
}

button { font: inherit; }

.app-shell {
  width: min(100%, 520px);
  min-height: 100svh;
  margin: 0 auto;
  padding: env(safe-area-inset-top) 20px calc(18px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
}

.topbar {
  height: 68px;
  display: grid;
  grid-template-columns: 92px 1fr 92px;
  align-items: center;
  gap: 10px;
}

.topbar > .icon-button { justify-self: start; }
.topbar-actions { display: flex; justify-content: flex-end; gap: 8px; }
.topbar-actions .icon-button { border-radius: 50%; }
.topbar-actions #resetButton {
  background: rgba(255,255,255,.075);
  border-color: rgba(255,255,255,.12);
}
.topbar-actions #resetButton svg { width: 20px; height: 20px; transform: translateX(-.25px); }

.brand {
  justify-self: center;
  display: flex;
  align-items: center;
  width: 88px;
  height: 42px;
  overflow: hidden;
}

.brand img { width: 100%; height: 100%; object-fit: cover; }

.icon-button {
  width: 44px;
  height: 44px;
  padding: 0;
  display: grid;
  place-items: center;
  color: #f6f8f8;
  background: rgba(255,255,255,.055);
  border: 1px solid rgba(255,255,255,.09);
  border-radius: 14px;
  cursor: pointer;
  transition: background .18s ease, transform .18s ease;
}

.icon-button:active { transform: scale(.94); background: rgba(255,255,255,.1); }
.icon-button svg { width: 21px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-button:disabled { cursor: default; color: #5f6867; background: rgba(255,255,255,.025); border-color: rgba(255,255,255,.05); }
.icon-button:disabled:active { transform: none; background: rgba(255,255,255,.025); }
.sound-button .sound-off { display: none; }
.sound-button[aria-pressed="false"] { color: #697271; background: rgba(255,255,255,.025); border-color: rgba(255,255,255,.06); }
.sound-button[aria-pressed="false"] .sound-on { display: none; }
.sound-button[aria-pressed="false"] .sound-off { display: block; }

.intro { text-align: center; margin: 18px auto 8px; max-width: 430px; }
.intro h1 { margin: 0; font-size: clamp(25px, 7vw, 32px); line-height: 1.1; letter-spacing: -.04em; }

.play-area {
  position: relative;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  align-items: center;
  min-height: 0;
  padding-top: clamp(28px, 7vh, 58px);
}

.mascot {
  position: absolute;
  z-index: 0;
  width: 52px;
  height: 50px;
  pointer-events: none;
  transform-origin: 50% 100%;
  animation: mascot-breathe 3.2s ease-in-out infinite;
  transition: left .35s ease, top .35s ease;
}

.mascot img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 6px 15px rgba(64,255,59,.12)); }

.mascot.celebrate { animation: mascot-jump .55s cubic-bezier(.2,.85,.25,1.2); }
.mascot.found { animation: mascot-wave 1.2s ease-in-out; }

.bubble-wrap {
  position: relative;
  z-index: 1;
  width: 100%;
  flex: 1;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  grid-template-rows: repeat(9, minmax(0, 1fr));
  align-items: center;
  gap: clamp(7px, 2.1vw, 11px);
}

.bubble {
  position: relative;
  z-index: 1;
  min-width: 0;
  width: 100%;
  max-width: 54px;
  aspect-ratio: 1;
  justify-self: center;
  padding: 0;
  border: .5px solid var(--bubble-outline);
  border-radius: 50%;
  background:
    radial-gradient(circle at 35% 28%, rgba(255,255,255,.29) 0, rgba(255,255,255,.11) 13%, transparent 31%),
    radial-gradient(circle at 50% 52%,
      var(--bubble-light) 0,
      var(--bubble-color) 55%,
      var(--bubble-mid) 78%,
      var(--bubble-dark) 100%);
  box-shadow:
    inset 3px 4px 9px rgba(255,255,255,.05),
    inset -4px -6px 10px rgba(0,0,0,.12),
    0 5px 9px rgba(0,0,0,.24);
  cursor: pointer;
  touch-action: manipulation;
  transition: filter .2s ease;
}

.color-orange {
  --bubble-rgb: 185, 79, 45;
  --bubble-light: #c96845;
  --bubble-color: #b94f2d;
  --bubble-mid: #934027;
  --bubble-dark: #622c21;
  --bubble-outline: rgba(225, 124, 86, .5);
}

.color-lime {
  --bubble-rgb: 154, 169, 55;
  --bubble-light: #aebb4c;
  --bubble-color: #9aa937;
  --bubble-mid: #78852f;
  --bubble-dark: #505a2a;
  --bubble-outline: rgba(198, 214, 90, .46);
}

.color-green {
  --bubble-rgb: 39, 104, 65;
  --bubble-light: #347d53;
  --bubble-color: #276841;
  --bubble-mid: #215438;
  --bubble-dark: #173c2a;
  --bubble-outline: rgba(82, 143, 103, .48);
}

.bubble:active:not(.popped) { transform: scale(.92); }
.bubble.popped {
  animation: pop .38s cubic-bezier(.15,.9,.3,1) forwards;
  pointer-events: none;
}
.bubble.restoring { animation: restore .38s cubic-bezier(.15,.9,.3,1.2) both; }

.particle {
  position: absolute;
  z-index: 4;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: rgba(var(--particle-rgb), .9);
  pointer-events: none;
  animation: particle .48s ease-out forwards;
}

@keyframes pop {
  0% { transform: scale(1); }
  30% { transform: scale(1.08); filter: brightness(1.28); opacity: 1; }
  62% { transform: scale(.7); filter: brightness(1.08) blur(.4px); opacity: .72; }
  100% { transform: scale(.05); filter: blur(1px); opacity: 0; }
}
@keyframes restore { 0% { transform: scale(.7); opacity: .15; } 70% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
@keyframes particle { to { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; } }
@keyframes mascot-breathe { 0%,100% { transform: translateY(2px) rotate(-1deg); } 50% { transform: translateY(-3px) rotate(1deg); } }
@keyframes mascot-jump { 0%,100% { transform: translateY(0) rotate(0); } 40% { transform: translateY(-18px) rotate(-5deg); } 70% { transform: translateY(-5px) rotate(4deg); } }
@keyframes mascot-wave {
  0% { transform: translateY(2px) scale(1) rotate(0); }
  14% { transform: translateY(-6px) scale(1.08) rotate(-8deg); }
  28% { transform: translateY(-7px) scale(1.08) rotate(7deg); }
  42% { transform: translateY(-7px) scale(1.08) rotate(-7deg); }
  56% { transform: translateY(-6px) scale(1.06) rotate(6deg); }
  72% { transform: translateY(-3px) scale(1.03) rotate(-3deg); }
  100% { transform: translateY(2px) scale(1) rotate(0); }
}

@media (max-height: 880px) {
  .intro { margin-top: 9px; margin-bottom: 5px; }
  .mascot { width: 50px; height: 48px; }
  .play-area { padding-top: 30px; }
}

@media (max-height: 780px) {
  .topbar { height: 58px; }
  .intro { margin-top: 5px; margin-bottom: 2px; }
  .intro h1 { font-size: 27px; }
  .mascot { width: 48px; height: 46px; }
  .play-area { padding-top: 18px; }
}

@media (max-width: 520px) {
  .app-shell { padding-left: 12px; padding-right: 12px; }
  .bubble-wrap { column-gap: 3px; }
  .bubble { max-width: 56px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
}

</style>

let poppedCount = 0;
let soundEnabled = true;
let nextSound = 0;

const colorNames = ['orange', 'lime', 'green'];
let colorVariants;
let mascotBubbleIndex = 0;

function shuffledColors() {
  const colors = Array.from({ length: BUBBLE_COUNT }, (_, index) => colorNames[index % colorNames.length]);
  for (let index = colors.length - 1; index > 0; index -= 1) {
    const swapIndex = Math.floor(Math.random() * (index + 1));
    [colors[index], colors[swapIndex]] = [colors[swapIndex], colors[index]];
  }
  return colors;
}

colorVariants = shuffledColors();

function makeBubble(index) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = `bubble color-${colorVariants[index]}`;
  button.dataset.index = String(index);
  button.setAttribute('aria-label', `Pop bubble ${index + 1}`);
  button.addEventListener('click', () => popBubble(button));
  return button;
}

function playPop() {
  if (!soundEnabled) return;
  const audio = popSounds[nextSound];
  nextSound = (nextSound + 1) % popSounds.length;
  audio.currentTime = 0;
  audio.play().catch(() => {});
}

function randomizeColors() {
  colorVariants = shuffledColors();
  [...grid.querySelectorAll('.bubble')].forEach((bubble, index) => {
    bubble.classList.remove('color-orange', 'color-lime', 'color-green');
    bubble.classList.add(`color-${colorVariants[index]}`);
  });
}

function positionMascot() {
  const bubbles = [...grid.querySelectorAll('.bubble')];
  const target = bubbles[mascotBubbleIndex];
  if (!target) return;
  mascot.style.left = `${target.offsetLeft + target.offsetWidth / 2 - mascot.offsetWidth / 2}px`;
  mascot.style.top = `${target.offsetTop + target.offsetHeight / 2 - mascot.offsetHeight * .48}px`;
}

function randomizeMascotSpot() {
  mascot.classList.remove('found');
  const row = 1 + Math.floor(Math.random() * 7);
  const column = 1 + Math.floor(Math.random() * 5);
  mascotBubbleIndex = row * 7 + column;
  requestAnimationFrame(positionMascot);
}

function makeParticles(bubble) {
  const gridRect = grid.getBoundingClientRect();
  const rect = bubble.getBoundingClientRect();
  const centerX = rect.left - gridRect.left + rect.width / 2;
  const centerY = rect.top - gridRect.top + rect.height / 2;
  const bubbleColor = getComputedStyle(bubble).getPropertyValue('--bubble-rgb').trim();

  for (let i = 0; i < 6; i += 1) {
    const particle = document.createElement('span');
    const angle = (Math.PI * 2 * i) / 6 + Math.random() * .3;
    const distance = 22 + Math.random() * 14;
    particle.className = 'particle';
    particle.style.left = `${centerX}px`;
    particle.style.top = `${centerY}px`;
    particle.style.setProperty('--x', `${Math.cos(angle) * distance}px`);
    particle.style.setProperty('--y', `${Math.sin(angle) * distance}px`);
    particle.style.setProperty('--particle-rgb', bubbleColor);
    grid.append(particle);
    particle.addEventListener('animationend', () => particle.remove());
  }
}

function celebrateIfComplete() {
  if (poppedCount === BUBBLE_COUNT) {
    mascot.classList.remove('celebrate');
    void mascot.offsetWidth;
    mascot.classList.add('celebrate');
  }
}

function popBubble(bubble) {
  if (bubble.classList.contains('popped')) return;
  bubble.classList.add('popped');
  bubble.setAttribute('aria-label', 'Popped bubble');
  bubble.setAttribute('aria-pressed', 'true');
  poppedCount += 1;
  makeParticles(bubble);
  playPop();
  navigator.vibrate?.(18);
  if (Number(bubble.dataset.index) === mascotBubbleIndex) {
    mascot.classList.remove('found');
    void mascot.offsetWidth;
    mascot.classList.add('found');
  }
  celebrateIfComplete();
}

function resetBubbles() {
  const bubbles = [...grid.querySelectorAll('.bubble')];
  poppedCount = 0;
  randomizeColors();
  randomizeMascotSpot();
  bubbles.forEach((bubble, index) => {
    window.setTimeout(() => {
      bubble.classList.remove('popped');
      bubble.classList.add('restoring');
      bubble.setAttribute('aria-label', `Pop bubble ${index + 1}`);
      bubble.removeAttribute('aria-pressed');
      bubble.addEventListener('animationend', () => bubble.classList.remove('restoring'), { once: true });
    }, index * 16);
  });
}

function closeWebView() {
  const message = { type: 'olymptrade:close-breather' };
  window.ReactNativeWebView?.postMessage(JSON.stringify(message));
  window.webkit?.messageHandlers?.olymptrade?.postMessage(message);

  if (!window.ReactNativeWebView && !window.webkit?.messageHandlers?.olymptrade) {
    if (history.length > 1) history.back();
    else window.close();
  }
}

for (let i = 0; i < BUBBLE_COUNT; i += 1) grid.append(makeBubble(i));
grid.append(mascot);
randomizeMascotSpot();
window.addEventListener('resize', positionMascot);
mascot.addEventListener('animationend', (event) => {
  if (event.animationName === 'mascot-wave') mascot.classList.remove('found');
});
resetButton.addEventListener('click', resetBubbles);
soundButton.addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  soundButton.setAttribute('aria-pressed', String(soundEnabled));
  soundButton.setAttribute('aria-label', soundEnabled ? 'Turn sound off' : 'Turn sound on');
});
document.querySelector('#backButton').addEventListener('click', closeWebView);

    </script>
  </body>
